<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Balls</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #000; }
        canvas { display: block; cursor: crosshair; }
        #counter {
            position: fixed; top: 10px; left: 10px;
            color: #fff; font-family: monospace; font-size: 14px;
            background: rgba(0,0,0,0.7); padding: 5px 10px;
            border-radius: 3px; z-index: 1000;
        }
        #status {
            position: fixed; top: 10px; right: 10px;
            color: #ff0; font-family: monospace; font-size: 14px;
            background: rgba(0,0,0,0.7); padding: 5px 10px;
            border-radius: 3px; z-index: 1000; display: none;
        }
        #hint {
            position: fixed; bottom: 10px; left: 50%;
            transform: translateX(-50%);
            color: #888; font-family: monospace; font-size: 12px;
            background: rgba(0,0,0,0.7); padding: 5px 10px;
            border-radius: 3px; z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="counter">Balls: 2</div>
    <div id="status">⚠ OVERFLOW — resetting...</div>
    <div id="hint">Click to add a ball</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const counter = document.getElementById('counter');
        const status = document.getElementById('status');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const BALL_RADIUS = 5;
        const BALL_DIAMETER = BALL_RADIUS * 2;
        const SPEED = 3;
        const GRAVITY = 0.5;

        let balls = [];
        let effects = [];
        let mode = 'normal';

        // Calculate maximum number of balls based on screen area and packing density
        function getMaxBalls() {
            const area = canvas.width * canvas.height;
            const ballArea = Math.PI * BALL_RADIUS * BALL_RADIUS;
            return Math.floor((area / ballArea) * 0.74);
        }

        function createBall() {
            return {
                x: Math.random() * (canvas.width - BALL_DIAMETER) + BALL_RADIUS,
                y: Math.random() * (canvas.height - BALL_DIAMETER) + BALL_RADIUS,
                vx: (Math.random() - 0.5) * SPEED * 2,
                vy: (Math.random() - 0.5) * SPEED * 2,
                color: `hsl(${Math.random() * 360}, 70%, 60%)`
            };
        }

        // Create a ball at a specific position
        function createBallAt(x, y) {
            return {
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * SPEED * 2,
                vy: (Math.random() - 0.5) * SPEED * 2,
                color: `hsl(${Math.random() * 360}, 70%, 60%)`
            };
        }

        // Create a wave effect from wall collision
        function createWave(x, y, color) {
            effects.push({
                type: 'wave',
                x: x,
                y: y,
                radius: 0,
                maxRadius: 30,
                alpha: 1,
                color: color
            });
        }

        // Create an explosion effect from ball collision
        function createExplosion(x, y, color) {
            effects.push({
                type: 'flash',
                x: x,
                y: y,
                radius: 0,
                maxRadius: 20,
                alpha: 1,
                color: color
            });

            const particleCount = 8;
            for (let i = 0; i < particleCount; i++) {
                const angle = (Math.PI * 2 * i) / particleCount;
                const speed = 2 + Math.random() * 2;
                effects.push({
                    type: 'particle',
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: 2,
                    alpha: 1,
                    color: color,
                    life: 1
                });
            }
        }

        // Create a visual effect on click
        function createClickEffect(x, y) {
            effects.push({
                type: 'click_flash',
                x: x,
                y: y,
                radius: 0,
                maxRadius: 40,
                alpha: 1,
                color: `hsl(${Math.random() * 360}, 70%, 60%)`
            });
        }

        function updateEffects() {
            for (let i = effects.length - 1; i >= 0; i--) {
                const effect = effects[i];

                if (effect.type === 'wave') {
                    effect.radius += 1.5;
                    effect.alpha -= 0.02;
                    if (effect.alpha <= 0 || effect.radius >= effect.maxRadius) {
                        effects.splice(i, 1);
                    }
                } else if (effect.type === 'flash') {
                    effect.radius += 1;
                    effect.alpha -= 0.05;
                    if (effect.alpha <= 0) {
                        effects.splice(i, 1);
                    }
                } else if (effect.type === 'click_flash') {
                    effect.radius += 2;
                    effect.alpha -= 0.04;
                    if (effect.alpha <= 0 || effect.radius >= effect.maxRadius) {
                        effects.splice(i, 1);
                    }
                } else if (effect.type === 'particle') {
                    effect.x += effect.vx;
                    effect.y += effect.vy;
                    effect.life -= 0.03;
                    effect.alpha = effect.life;
                    if (effect.life <= 0) {
                        effects.splice(i, 1);
                    }
                }
            }
        }

        function drawEffects() {
            for (let effect of effects) {
                if (effect.type === 'wave') {
                    ctx.beginPath();
                    ctx.arc(effect.x, effect.y, effect.radius, 0, Math.PI * 2);
                    ctx.strokeStyle = effect.color.replace('60%', '70%');
                    ctx.lineWidth = 2;
                    ctx.globalAlpha = effect.alpha;
                    ctx.stroke();
                    ctx.globalAlpha = 1;
                } else if (effect.type === 'flash') {
                    ctx.beginPath();
                    ctx.arc(effect.x, effect.y, effect.radius, 0, Math.PI * 2);
                    ctx.fillStyle = effect.color.replace('60%', '80%');
                    ctx.globalAlpha = effect.alpha * 0.5;
                    ctx.fill();
                    ctx.globalAlpha = 1;
                } else if (effect.type === 'click_flash') {
                    ctx.beginPath();
                    ctx.arc(effect.x, effect.y, effect.radius, 0, Math.PI * 2);
                    ctx.strokeStyle = effect.color;
                    ctx.lineWidth = 3;
                    ctx.globalAlpha = effect.alpha;
                    ctx.stroke();
                    ctx.globalAlpha = 1;
                } else if (effect.type === 'particle') {
                    ctx.beginPath();
                    ctx.arc(effect.x, effect.y, effect.radius, 0, Math.PI * 2);
                    ctx.fillStyle = effect.color;
                    ctx.globalAlpha = effect.alpha;
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }
            }
        }

        function resetBalls() {
            balls = [createBall(), createBall()];
            effects = [];
            mode = 'normal';
            status.style.display = 'none';
        }

        balls.push(createBall());
        balls.push(createBall());

        // Click handler
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // Spawn a ball at the click position
            balls.push(createBallAt(x, y));
            
            // Visual click effect
            createClickEffect(x, y);
        });

        function checkCollision(b1, b2) {
            const dx = b2.x - b1.x;
            const dy = b2.y - b1.y;
            return Math.sqrt(dx * dx + dy * dy) < BALL_DIAMETER;
        }

        function resolveCollision(b1, b2) {
            const dx = b2.x - b1.x;
            const dy = b2.y - b1.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance === 0) return;

            const nx = dx / distance;
            const ny = dy / distance;
            const dvx = b1.vx - b2.vx;
            const dvy = b1.vy - b2.vy;
            const dvn = dvx * nx + dvy * ny;

            if (dvn < 0) return;

            b1.vx -= dvn * nx;
            b1.vy -= dvn * ny;
            b2.vx += dvn * nx;
            b2.vy += dvn * ny;

            const overlap = BALL_DIAMETER - distance;
            b1.x -= overlap * nx * 0.5;
            b1.y -= overlap * ny * 0.5;
            b2.x += overlap * nx * 0.5;
            b2.y += overlap * ny * 0.5;

            const collisionX = (b1.x + b2.x) / 2;
            const collisionY = (b1.y + b2.y) / 2;
            createExplosion(collisionX, collisionY, b1.color);
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (mode === 'normal') {
                const newBalls = [];

                for (let ball of balls) {
                    ball.x += ball.vx;
                    ball.y += ball.vy;

                    // Bounce off walls and create wave effect
                    if (ball.x - BALL_RADIUS <= 0) {
                        ball.x = BALL_RADIUS;
                        ball.vx = Math.abs(ball.vx);
                        createWave(0, ball.y, ball.color);
                    }
                    if (ball.x + BALL_RADIUS >= canvas.width) {
                        ball.x = canvas.width - BALL_RADIUS;
                        ball.vx = -Math.abs(ball.vx);
                        createWave(canvas.width, ball.y, ball.color);
                    }
                    if (ball.y - BALL_RADIUS <= 0) {
                        ball.y = BALL_RADIUS;
                        ball.vy = Math.abs(ball.vy);
                        createWave(ball.x, 0, ball.color);
                    }
                    if (ball.y + BALL_RADIUS >= canvas.height) {
                        ball.y = canvas.height - BALL_RADIUS;
                        ball.vy = -Math.abs(ball.vy);
                        createWave(ball.x, canvas.height, ball.color);
                    }
                }

                // Check collisions between balls
                for (let i = 0; i < balls.length; i++) {
                    for (let j = i + 1; j < balls.length; j++) {
                        if (checkCollision(balls[i], balls[j])) {
                            resolveCollision(balls[i], balls[j]);
                            newBalls.push(createBall());
                        }
                    }
                }

                if (newBalls.length > 0) {
                    balls = balls.concat(newBalls);
                }

                // Check for screen overflow
                if (balls.length >= getMaxBalls()) {
                    mode = 'falling';
                    status.style.display = 'block';
                    // Give all balls initial downward velocity
                    for (let ball of balls) {
                        ball.vy = Math.abs(ball.vy) + 2;
                    }
                }
            } else if (mode === 'falling') {
                // Apply gravity and fall
                for (let ball of balls) {
                    ball.vy += GRAVITY;
                    ball.x += ball.vx;
                    ball.y += ball.vy;
                }
                // Remove balls that have fallen off screen
                balls = balls.filter(b => b.y - BALL_RADIUS < canvas.height);

                // Reset when all balls are gone
                if (balls.length === 0) {
                    resetBalls();
                }
            }

            updateEffects();
            drawEffects();

            // Draw balls
            for (let ball of balls) {
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
                ctx.fillStyle = ball.color;
                ctx.fill();
            }

            counter.textContent = `Balls: ${balls.length} / ${getMaxBalls()}`;

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
